services:
  backend:
    build:
      context: ./Laba2
      dockerfile: Laba2/Dockerfile
    container_name: producthub-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=data/app.db"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/wwwroot/uploads

  frontend:
    build:
      context: ./Laba2-ui
    container_name: producthub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend