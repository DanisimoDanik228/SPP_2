services:
  backend:
    build:
      context: ./backend
    container_name: producthub-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      DB_PATH: /app/data/products.db
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      AUTH_MAX_ACTIVE_SESSIONS: ${AUTH_MAX_ACTIVE_SESSIONS:-3}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./Laba2-ui
    container_name: producthub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend