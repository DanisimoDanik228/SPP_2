services:
  backend:
    build:
      context: ./backend
    container_name: producthub-backend
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
      DB_PATH: /app/data/products.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./Laba2-ui
    container_name: producthub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend